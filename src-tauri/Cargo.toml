[package]
name = "mushoku-guild"
version = "0.0.0"
description = "Mushoku Guild: a lightweight game-inspired desktop app for orchestrating AI-assisted development"
edition = "2021"
publish = false

[lib]
name = "mushoku_guild_lib"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.41.1", features = ["bundled"] }
ureq = { version = "3.5.1", features = ["json"] }
sha2 = "0.11.1"
base64 = "0.23.1"
getrandom = "0.4.3"
tauri-plugin-dialog = "2"
keyring = { version = "3", features = ["windows-native"] }
windows-sys = { version = "0.61.2", features = ["Win32_System_JobObjects", "Win32_Foundation", "Win32_Security", "Win32_System_Threading", "Win32_System_IO"] }

# Release profile tuned for a small binary (installer size is an ADR-0012 budget item).
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
